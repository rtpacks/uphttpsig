[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uphttpsig"
version = "0.1.0"
description = "Python 3.11 compatible replacement for the legacy httpsig package"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Mr.MF", email = "Mr.MF@foxmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=3.4",
]

[project.urls]
Homepage = "https://github.com/rtpacks/uphttpsig"
Repository = "https://github.com/rtpacks/uphttpsig"
Issues = "https://github.com/rtpacks/uphttpsig/issues"

[project.optional-dependencies]
requests = ["requests>=2"]
test = [
    "requests>=2",
]

[tool.setuptools]
packages = ["uphttpsig"]

[tool.pytest.ini_options]
testpaths = ["uphttpsig/tests"]
