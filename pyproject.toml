[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uphttpsig"
version = "0.1.0"
description = "Python 3.11 compatible replacement for the legacy httpsig package"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "cryptography>=3.4",
]

[project.optional-dependencies]
requests = ["requests>=2"]
test = [
    "requests>=2",
]

[tool.setuptools]
packages = ["uphttpsig"]

[tool.pytest.ini_options]
testpaths = ["uphttpsig/tests"]
